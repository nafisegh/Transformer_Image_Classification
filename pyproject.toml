[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vit-image-classifier"
version = "0.1.0"
description = "A four-stage supervised image classification workflow using a Vision Transformer"
requires-python = ">=3.10"
dependencies = ["tensorflow>=2.15", "Pillow>=10", "numpy>=1.24", "scikit-learn>=1.3"]

[project.scripts]
vit-classifier = "image_classifier.cli:main"

[tool.setuptools.packages.find]
include = ["image_classifier*"]
